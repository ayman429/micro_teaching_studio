  animated_floating_buttons: ^0.0.2
  horizontal_week_calendar:
  table_calendar:
  pinput: ^3.0.1
  # device_preview:
  flutter_slidable: ^4.0.3
  syncfusion_flutter_pdfviewer: 
  syncfusion_flutter_core:
